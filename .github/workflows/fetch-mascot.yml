# One-off helper: pulls the Ada mascot from the BCS site into assets/ so the
# homepage stops hot-linking it. Run manually, then delete this file.
name: Fetch mascot image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://bcswomenlovelace.bcs.org/wp-content/uploads/AdaMarkMS-768x880.png" \
            -o assets/ada-lovelace.png
          # Fail loudly rather than committing an error page saved as a .png.
          file assets/ada-lovelace.png | grep -q 'PNG image data'
          test "$(stat -c%s assets/ada-lovelace.png)" -gt 5000
          file assets/ada-lovelace.png
          stat -c'%s bytes' assets/ada-lovelace.png

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ada-lovelace.png
          git commit -m "Add Ada mascot image to assets/

          Downloaded from bcswomenlovelace.bcs.org so the homepage can serve
          the mascot from this repository instead of hot-linking it."
          git push
